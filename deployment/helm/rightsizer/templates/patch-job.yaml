{{- if and .Values.patch.enabled (not (empty .Values.patch.image.tag)) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rightsizer.fullname" . }}-patch
  labels:
    app.kubernetes.io/name: {{ include "rightsizer.name" . }}-patch
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "rightsizer.chart" . }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: {{ .Values.patch.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.patch.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rightsizer.name" . }}-patch
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        helm.sh/chart: {{ include "rightsizer.chart" . }}
    spec:
      containers:
        - name: rightsizer-patch
          image: "{{ .Values.patch.image.repository }}:{{ .Values.patch.image.tag }}"
          imagePullPolicy: {{ .Values.patch.image.pullPolicy }}
          env:
            - name: r8s_mongo_user
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: username
            - name: r8s_mongo_password
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: password
            - name: r8s_mongo_url
              value: "{{ .Values.mongoService }}:{{ .Values.mongoPort }}"
            - name: r8s_mongo_db_name
              value: "{{ .Values.modularDatabaseName }}"
      restartPolicy: OnFailure
{{- end }}
